name: Build add-on images

on:
  push:
    tags: ["*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: armv7
            platform: linux/arm/v7
          - arch: i386
            platform: linux/386
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase owner for image tags
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Read version from addon config
        id: ver
        run: |
          VERSION=$(sed -nE 's/^version: *"([^"]+)".*/\1/p' addon/config.yaml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.22
          labels: |
            io.hass.name=Tuscany CUP Checker
            io.hass.description=Periodically checks the Tuscany CUP portal and alerts when an appointment slot frees up
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
            io.hass.version=${{ steps.ver.outputs.version }}
            io.hass.url=https://github.com/VoidElle/tuscany-CUP-periodic-checker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.arch }}-tuscany-cup-checker:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ matrix.arch }}-tuscany-cup-checker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
